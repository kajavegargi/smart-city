{% extends "base.html" %}

{% block title %}Response{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-display font-bold text-white">Response &amp; Routing</h1>
  <button id="simulate-event-btn"
          class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-lg shadow">
    Simulate Event
  </button>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
  <div class="lg:col-span-2 bg-bg-surface border border-border-dim rounded-xl shadow p-4">
    <div id="response-map" style="height: 500px;" class="rounded-lg"></div>
  </div>

  <div class="bg-bg-surface border border-border-dim rounded-xl shadow p-4">
    <h2 class="text-lg font-semibold mb-3 text-white">Active Events</h2>
    <ul id="events-list" class="space-y-2 text-sm text-text-dim">
      <li>No events yet.</li>
    </ul>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/map_template.js') }}"></script>
<script src="{{ url_for('static', filename='js/response.js') }}"></script>
{% endblock %}

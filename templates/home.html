{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
   <h1 class="text-2xl font-bold mb-6">City Overview</h1>
   <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500">Active Alerts</div>
            <div id="summary-alerts" class="text-3xl font-bold">–</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500">Sensor Types Online</div>
            <div id="summary-sensors" class="text-3xl font-bold">–</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <div class="text-sm text-gray-500">Active Events</div>
            <div id="summary-events" class="text-3xl font-bold">–</div>
        </div>
   </div>
{% endblock %}

{% block scripts %}
    <script>
    async function loadSummary() {
        const res = await fetch("/api/summary");
        const data = await res.json();
        document.getElementById("summary-alerts").textContent = data.active_alerts;
        document.getElementById("summary-sensors").textContent = data.sensor_types_online;
        document.getElementById("summary-events").textContent = data.active_events;
    }
    loadSummary();
    setInterval(loadSummary, 5000);
    </script>
{% endblock %}
